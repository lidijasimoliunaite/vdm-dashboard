<title>VDM Progresas</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;font-size:13px;background:#f0f2f5;color:#1a2330;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.hdr{background:#1a5c38;padding:10px 18px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.hdr-logo{font-size:11px;font-weight:700;color:white;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);padding:2px 8px;border-radius:3px}
.hdr-title{font-size:14px;font-weight:600;color:white}
.hdr-right{margin-left:auto;font-size:11px;color:rgba(255,255,255,.6)}
.cat-bar{background:white;border-bottom:1px solid #e2e6ea;padding:8px 16px;display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap}
.cat-lbl{font-size:11px;color:#8a96a8;font-weight:500;margin-right:2px}
.cat-btn{font-size:12px;font-weight:600;padding:5px 18px;border-radius:20px;border:1.5px solid #cdd3da;background:white;color:#4a5568;cursor:pointer}
.cat-btn.active{background:#1a5c38;color:white;border-color:#1a5c38}
.type-btn{font-size:11px;font-weight:500;padding:4px 12px;border-radius:20px;border:1px solid #cdd3da;background:white;color:#8a96a8;cursor:pointer;margin-left:4px}
.type-btn.active{background:#e8f3ec;color:#1a5c38;border-color:#1a5c38}
.main{flex:1;display:grid;grid-template-columns:280px 1fr;overflow:hidden}
.sidebar{background:white;border-right:1px solid #e2e6ea;display:flex;flex-direction:column;overflow:hidden}
.kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:8px}
.kpi{border-radius:6px;padding:7px 10px;border:0.5px solid #e2e6ea;border-left:3px solid}
.kpi-val{font-size:20px;font-weight:300;font-family:monospace;line-height:1}
.kpi-lbl{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:#8a96a8;margin-top:2px}
.search-wrap{padding:0 8px 6px}
.search{width:100%;font-size:12px;padding:5px 10px;border:1px solid #e2e6ea;border-radius:6px;outline:none}
.list-hdr{padding:5px 12px;background:#f9fafb;border-top:1px solid #e2e6ea;border-bottom:1px solid #e2e6ea;font-size:10px;font-weight:600;color:#8a96a8;text-transform:uppercase;letter-spacing:.4px;display:flex;justify-content:space-between}
.list-body{flex:1;overflow-y:auto}
.st-item{display:flex;align-items:flex-start;gap:7px;padding:6px 10px;border-bottom:0.5px solid #f5f6f7;cursor:pointer}
.st-item:hover{background:#f9fafb}
.st-item.active{background:#e8f3ec}
.st-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:3px}
.st-info{flex:1;min-width:0}
.st-name{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-meta{font-size:10px;color:#8a96a8;margin-top:1px}
.badge{font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px;white-space:nowrap;flex-shrink:0;margin-top:1px}
.b-done{background:#dcfce7;color:#15803d}
.b-wip{background:#fef3c7;color:#b45309}
.b-wait{background:#fee2e2;color:#b91c1c}
.b-none{background:#f0f2f5;color:#8a96a8}
#map{width:100%;height:100%}
.popup-hdr{padding:7px 10px;font-size:13px;font-weight:600;color:white;margin:-10px -10px 8px -10px;border-radius:4px 4px 0 0}
.popup-row{display:flex;justify-content:space-between;align-items:center;padding:2px 0;font-size:11px;border-bottom:0.5px solid #f5f6f7}
.popup-row:last-child{border-bottom:none}
.popup-key{color:#8a96a8}
.popup-link{color:#1a5fa8;text-decoration:none;font-family:monospace;font-size:10px}
</style>
</head>

// LKS94 to WGS84
function lks2wgs(northing, easting) {
  const a=6378137.0,f=1/298.257222101,k0=0.9998,lon0=24*Math.PI/180,FE=500000;
  const e2=2*f-f*f;
  const x1=easting-FE,y1=northing;
  const M=y1/k0;
  const mu=M/(a*(1-e2/4-3*e2*e2/64-5*Math.pow(e2,3)/256));
  const e1=(1-Math.sqrt(1-e2))/(1+Math.sqrt(1-e2));
  const phi1=mu+(3*e1/2-27*Math.pow(e1,3)/32)*Math.sin(2*mu)+(21*e1*e1/16-55*Math.pow(e1,4)/32)*Math.sin(4*mu)+(151*Math.pow(e1,3)/96)*Math.sin(6*mu)+(1097*Math.pow(e1,4)/512)*Math.sin(8*mu);
  const N1=a/Math.sqrt(1-e2*Math.sin(phi1)*Math.sin(phi1));
  const T1=Math.tan(phi1)*Math.tan(phi1);
  const C1=e2*Math.cos(phi1)*Math.cos(phi1)/(1-e2);
  const R1=a*(1-e2)/Math.pow(1-e2*Math.sin(phi1)*Math.sin(phi1),1.5);
  const D=x1/(N1*k0);
  const lat=phi1-(N1*Math.tan(phi1)/R1)*(D*D/2-(5+3*T1+10*C1-4*C1*C1-9*e2)*Math.pow(D,4)/24+(61+90*T1+298*C1+45*T1*T1-252*e2-3*C1*C1)*Math.pow(D,6)/720);
  const lon=lon0+(D-(1+2*T1+C1)*Math.pow(D,3)/6+(5-2*C1+28*T1-3*C1*C1+8*e2+24*T1*T1)*Math.pow(D,5)/120)/Math.cos(phi1);
  return [lat*180/Math.PI, lon*180/Math.PI];
}

let currentCat='GEOD', showStotys=true, showTarp=true;
let map, markersLayer, linesLayer;

function statusColor(s){return s==='Baigta'?'#15803d':s==='Vykdoma'?'#f59e0b':'#ef4444';}
function statusClass(s){return s==='Baigta'?'b-done':s==='Vykdoma'?'b-wip':s==='Atidėta'?'b-wait':'b-none';}

function getCoords(id){
  const c=COORDS[id];
  if(!c) return null;
  return lks2wgs(c[0],c[1]);
}

function renderKpi(){
  const s=showStotys?DATA[currentCat].stotis:[];
  const t=showTarp?DATA[currentCat].tarpstotis:[];
  const all=[...s,...t];
  document.getElementById('k-total').textContent=all.length;
  document.getElementById('k-done').textContent=all.filter(r=>r[2]==='Baigta').length;
  document.getElementById('k-wip').textContent=all.filter(r=>r[2]==='Vykdoma').length;
  document.getElementById('k-wait').textContent=all.filter(r=>r[2]==='Atidėta').length;
}

function renderList(){
  const search=document.querySelector('.search').value.toLowerCase();
  const s=showStotys?DATA[currentCat].stotis.map(r=>({id:r[0],name:r[1],status:r[2],jira:r[3],start:r[4],end:r[5],type:'stotis'})):[];
  const t=showTarp?DATA[currentCat].tarpstotis.map(r=>({id:r[0],name:r[1],status:r[2],jira:r[3],start:r[4],end:r[5],track:r[6],type:'tarpstotis'})):[];
  let items=[...s,...t];
  if(search) items=items.filter(it=>it.name.toLowerCase().includes(search)||(it.id||'').toLowerCase().includes(search));
  document.getElementById('list-count').textContent=items.length;
  document.getElementById('list-body').innerHTML=items.map(it=>`
    <div class="st-item" onclick="focusItem('${it.id}','${it.type}')" id="item-${it.id}">
      <div class="st-dot" style="background:${statusColor(it.status)}"></div>
      <div class="st-info">
        <div class="st-name">${it.name}</div>
        <div class="st-meta">${it.id}${it.track?' · '+it.track:''}${it.jira?' · '+it.jira:''}</div>
      </div>
      <span class="badge ${statusClass(it.status)}">${it.status}</span>
    </div>`).join('');
}

function makePopup(id,name,status,jira,start,end,type,track){
  const color=statusColor(status);
  const jiraHtml=jira?`<a class="popup-link" href="https://jira.litrail.lt/browse/${jira}" target="_blank">${jira}</a>`:'—';
  return `<div class="popup-hdr" style="background:${color}">${name}</div>
    <div class="popup-row"><span class="popup-key">ID</span><span style="font-family:monospace;font-size:10px">${id}</span></div>
    <div class="popup-row"><span class="popup-key">Statusas</span><span class="badge ${statusClass(status)}">${status}</span></div>
    <div class="popup-row"><span class="popup-key">Jira</span>${jiraHtml}</div>
    <div class="popup-row"><span class="popup-key">Pradžia</span><span>${start||'—'}</span></div>
    <div class="popup-row"><span class="popup-key">Pabaiga</span><span>${end||'—'}</span></div>
    ${track?`<div class="popup-row"><span class="popup-key">Kelias</span><span style="font-size:10px;color:#1a5c38">${track}</span></div>`:''}`;
}

function renderMap(){
  markersLayer.clearLayers();
  linesLayer.clearLayers();
  const cat=DATA[currentCat];

  if(showTarp){
    cat.tarpstotis.forEach(r=>{
      const [id,name,status,jira,start,end,track]=r;
      const sts=TARP_ST[id];
      if(!sts) return;
      const coords=sts.map(sid=>sid?getCoords(sid):null).filter(Boolean);
      if(coords.length<2) return;
      const color=statusColor(status);
      L.polyline(coords,{color,weight:track==='dvikelis'?4:2,opacity:0.8})
        .bindPopup(makePopup(id,name,status,jira,start,end,'tarpstotis',track))
        .addTo(linesLayer);
      const mid=[(coords[0][0]+coords[1][0])/2,(coords[0][1]+coords[1][1])/2];
      L.circleMarker(mid,{radius:4,fillColor:color,color:'white',weight:1.5,fillOpacity:1})
        .bindPopup(makePopup(id,name,status,jira,start,end,'tarpstotis',track))
        .addTo(markersLayer);
    });
  }

  if(showStotys){
    cat.stotis.forEach(r=>{
      const [id,name,status,jira,start,end]=r;
      const wgs=getCoords(id);
      if(!wgs) return;
      const color=statusColor(status);
      L.circleMarker(wgs,{radius:7,fillColor:color,color:'white',weight:2,fillOpacity:1})
        .bindPopup(makePopup(id,name,status,jira,start,end,'stotis',null))
        .addTo(markersLayer);
    });
  }
}

function focusItem(id,type){
  const wgs=getCoords(id);
  if(wgs) map.setView(wgs,12);
  document.querySelectorAll('.st-item').forEach(el=>el.classList.remove('active'));
  const el=document.getElementById('item-'+id);
  if(el){el.classList.add('active');el.scrollIntoView({block:'nearest'});}
}

function setCat(cat,btn){
  currentCat=cat;
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderKpi();renderList();renderMap();
}

function toggleType(type){
  if(type==='stotis'){showStotys=!showStotys;document.getElementById('btn-stotys').classList.toggle('active',showStotys);}
  else{showTarp=!showTarp;document.getElementById('btn-tarp').classList.toggle('active',showTarp);}
  renderKpi();renderList();renderMap();
}

map=L.map('map').setView([55.3,23.9],7);

  subdomains:'abcd',maxZoom:19
}).addTo(map);
linesLayer=L.layerGroup().addTo(map);
markersLayer=L.layerGroup().addTo(map);

const n=new Date();
document.getElementById('hdr-date').textContent=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;

renderKpi();renderList();renderMap();
</script>
